    <section id="about" class="about-page__section">
      <p class="eyebrow">About Canonical Shelf</p>
      <h2>A Bible-learning environment, reference library, and study tool.</h2>
      <p>Canonical Shelf combines a guided Pathway, the biblical text, a visual canonical shelf, book profiles, a reference Catalog, active Practice, and deeper study tools. It is built for an adult who may begin with little biblical background but should not be limited to shallow explanations.</p>
      <p>The goal is not permanent dependence on lessons. At the start, the question is often “What should I learn next?” Over time it becomes “I know how to look into this responsibly”: finding the relevant texts, telling evidence from interpretation, comparing credible readings, and seeing what remains uncertain. The Pathway shows you what to notice first, then hands more of that work to you.</p>
      <p><a href="/course?unit=unit.orientation&amp;lesson=orientation">How Canonical Shelf works</a> walks through using the site, the kinds of material it holds, and why the Pathway is ordered the way it is.</p>
    </section>

    <section id="name" class="about-page__section">
      <p class="eyebrow">The name</p>
      <h2>Why “Canonical Shelf”?</h2>
      <p>Canon comes through the Greek <em>kanōn</em>, a measuring rod or standard. Christians came to use it for the collection of writings a community recognizes as Scripture. So the biblical canon is not simply every ancient religious book; it is the particular collection a community receives as its Bible.</p>
      <p>Canonical Shelf uses the 66-book Protestant canon: 39 books in the Old Testament and 27 in the New. Roman Catholic and Eastern Orthodox Bibles include additional Old Testament books, and Orthodox churches differ among themselves. The shelf is the picture this site is built around: a library you can see whole, where each book has its place.</p>
    </section>

    <section id="approach" class="about-page__section">
      <p class="eyebrow">How Canonical Shelf approaches Scripture</p>
      <h2>Text first. Context visible. Interpretation labeled.</h2>
      <p>Canonical Shelf treats Scripture as inspired and authoritative Christian Scripture while reading passages in literary, historical, cultural, linguistic, and canonical context. It distinguishes what a text says from later assumptions placed on it and keeps biblical text, historical evidence, translation, interpretation, reception, doctrine, and application visibly distinct.</p>
      <p>Where Christians or scholars responsibly disagree, Canonical Shelf identifies the disagreement and the evidence behind the principal readings. When Canonical Shelf holds a position on a genuinely disputed question, it names that position, bounds it by the Statement of Faith, and represents interpretations it disagrees with accurately enough for the learner to weigh them. Agreement is never required to use Canonical Shelf; learning activities assess understanding and reasoning, not theological assent, and Canonical Shelf does not use learning or reflection data to infer what a learner believes.</p>
    </section>

    <section id="sources" class="about-page__section">
      <p class="eyebrow">Sources &amp; methodology</p>
      <h2>Claims should be traceable.</h2>
      <p>Pathway and reference content combine primary biblical readings with historical, literary, linguistic, archaeological, cultural, and theological context where relevant. Guided learning adds explicit objectives, plain-language explanations, vocabulary, reflection, and mastery checks; deeper study surfaces preserve source trails, competing readings, and supporting evidence.</p>
      <p>Scholarly claims should be traceable, uncertainty should be visible, and contested reconstructions should not be presented as settled fact. Progressive disclosure keeps the main lesson focused while drawers, Topics, Bible tools, and deeper study surfaces make additional background, evidence, interpretation, and sources available when they are useful.</p>
    </section>

    <section id="translations" class="about-page__section">
      <p class="eyebrow">Translation information</p>
      <h2>Translation is part of interpretation.</h2>
      <p>The complete local Bible reader currently ships with the Berean Standard Bible corpus. Additional translation wording is shown only where Canonical Shelf has the corresponding text and permission to distribute it; a translation selector must not imply that a complete corpus exists when it does not. Translation controls affect Scripture display, not the substance of the curriculum.</p>
      <p>Lessons may compare English translations, manuscript evidence, idioms, semantic ranges, or textual variants when those differences matter to understanding. Translation choices, source-text questions, and later interpretive conclusions are treated as related but distinct issues.</p>
    </section>

    <section id="accessibility" class="about-page__section">
      <p class="eyebrow">Accessibility</p>
      <h2>Rich interaction needs an equivalent path.</h2>
      <p>Canonical Shelf is designed for keyboard navigation, visible focus, screen readers, touch, contrast, zoom and reflow, reduced motion, forced colors, and accessible alternatives to drag or spatial manipulation. Accessibility is treated as a floor for the experience, not a reason to reduce the visual or interactive quality of the default product. Human assistive-technology and device testing remains part of release review.</p>
    </section>

    <section id="privacy" class="about-page__section">
      <p class="eyebrow">Privacy</p>
      <h2>Local-first by default, explicit when data leaves the device.</h2>
      <p>Guest and offline use are first-class, and no account is required for the core learning experience. Learning progress, review state, recent activity, appearance preferences, Journal writing, and the active Theologian transcript are designed to remain local unless you deliberately use a feature that transfers data, such as optional account sync, cloud Theologian, or Feedback &amp; reviews.</p>
      <p>Cloud Theologian sends only the current question, bounded recent conversation, route/activity context, and allowlisted study-state summary needed for the response; Journal text, lesson notes, reflection writing, account/profile identifiers, feedback content, and inferred theological beliefs are excluded. Anonymous feedback replies use a random browser identifier whose one-way hash is stored server-side rather than an IP-based identity. Personal reflection is not scored for theological agreement, and Canonical Shelf does not use learning activity to infer what a learner believes.</p>
      <p>Full disclosures: <a href="/privacy.html">Privacy Policy</a>, <a href="/data-retention.html">Data Retention Policy</a>, <a href="/storage.html">Cookies &amp; Local Storage</a>, and <a href="/terms.html">Terms of Use</a>.</p>
    </section>

    <section id="help" class="about-page__section">
      <p class="eyebrow">Crisis help</p>
      <h2>If you are struggling right now</h2>
      <p>If you are in danger, call 911 or your local emergency number. In the United States, you can call or text 988 at any time to reach the Suicide &amp; Crisis Lifeline. Theologian can point you toward help, but it is not a crisis service.</p>
