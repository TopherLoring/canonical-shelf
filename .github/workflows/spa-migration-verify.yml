name: spa-migration-verify
on:
  push:
    branches: [refactor/dom-template-views-20260924]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    env:
      D1_DATABASE_ID: 00000000-0000-0000-0000-000000000000
      BETTER_AUTH_URL: https://the-canonical-shelf.christopherwonder.workers.dev
      CANONICAL_ORIGIN: https://the-canonical-shelf.christopherwonder.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/dom-template-views-20260924
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Apply phase 1 — DOM views and SPA router
        run: bun scripts/apply-spa-migration.mjs phase1
      - name: Gate G1 — same-document SPA behavior
        run: bunx playwright test tests/contracts/product-contract.spec.js
      - name: Apply phase 2 — remove generated route documents
        run: bun scripts/apply-spa-migration.mjs phase2
      - name: Gate G2/G3 — full product verification
        run: bun run verify
      - name: Validate Cloudflare SPA target
        run: bun run generate:wrangler && bun run validate:cloudflare && bunx wrangler deploy --dry-run --outdir=/tmp/canonical-shelf-dry-run
      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "refactor: restore Canonical Shelf single-page architecture"
            git push origin HEAD:refactor/dom-template-views-20260924
          fi
