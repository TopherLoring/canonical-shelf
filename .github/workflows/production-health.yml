name: production-health
# Re-runs the deployment checks against the live site every six hours, so a deploy from anywhere other than
# deploy-production (for example a Cloudflare dashboard build that ships the files without the Worker) fails
# loudly instead of silently breaking the API and deep links.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # GITHUB_SHA is the latest main commit, so this also fails if production is not running the latest main.
      - name: Verify the live site
        run: bun scripts/verify-deployment.mjs
