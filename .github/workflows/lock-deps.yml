name: lock-dependencies
on:
  push:
    branches: [production-hardening]
permissions:
  contents: write
jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message || '', '[dependency-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Check lockfile
        id: lock
        run: |
          if [ -f bun.lock ] && ! grep -q '"lockfileVersion": 2' bun.lock; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate compatible lockfile
        if: steps.lock.outputs.needed == 'true'
        run: |
          rm -f bun.lock bun.lockb
          bun install --lockfile-only
      - name: Commit lockfile
        if: steps.lock.outputs.needed == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock
          if [ -f bun.lockb ]; then git add bun.lockb; fi
          git commit -m "build: lock dependencies with Bun 1.2.15 [dependency-lock]"
          git pull --rebase origin production-hardening
          git push origin HEAD:production-hardening
