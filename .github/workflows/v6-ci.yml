name: production-ci
on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      D1_DATABASE_ID: 00000000-0000-0000-0000-000000000000
      BETTER_AUTH_URL: https://canonical-shelf.example
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --frozen-lockfile
      - name: Verify pre-launch code/runtime/state integrity
        run: bun run verify
      - name: Validate Cloudflare production config
        run: bun run generate:wrangler && bunx wrangler deploy --dry-run --outdir=/tmp/canonical-shelf-dry-run
