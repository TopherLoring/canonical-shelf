<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canonical Shelf templates</title>
<style>
  :root { color-scheme: light; --bg: #E4E6EA; --ink: #141B2D; --muted: #5F6778; --line: #D6D9DF; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px 20px; background: #FCFCFB; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0; }
  label { display: flex; gap: 8px; align-items: center; }
  select { font: inherit; padding: 6px 8px; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  main { padding: 24px; display: flex; justify-content: center; }
  iframe { display: block; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 8px 28px #141b2d24; max-width: 100%; }
  iframe.phone { border-radius: 48px; box-shadow: 0 0 0 10px #111, 0 18px 40px #141b2d40; }
</style>
</head>
<body>
<header>
  <h1>Canonical Shelf · six screens</h1>
  <label>Screen <select id="screen"><option value="shelf">Shelf</option><option value="path">Learning Path</option><option value="path-a">Learning Path · option A (contents)</option><option value="lesson">Lesson</option><option value="reader">Bible</option><option value="topics">Study Topics</option><option value="practice">Review &amp; Practice</option></select></label>
  <label>Size <select id="size">
    <option value="1440x900">Desktop · 1440 × 900 (board size)</option>
    <option value="1280x800">Laptop · 1280 × 800</option>
    <option value="1920x1080">Wide · 1920 × 1080</option>
    <option value="1024x768">Small desktop · 1024 × 768</option>
    <option value="390x844">Phone · 390 × 844 (board size)</option>
    <option value="360x780">Small phone · 360 × 780</option>
    <option value="430x932">Large phone · 430 × 932</option>
    <option value="768x1024">Tablet portrait · 768 × 1024</option>
  </select></label>
  <p>Everything scales with the window it is drawn in; the boards' sizes reproduce the boards exactly.</p>
</header>
<main><iframe id="preview" title="Template preview"></iframe></main>
<script>
  const screen = document.querySelector('#screen'), size = document.querySelector('#size'), frame = document.querySelector('#preview');
  function update() {
    const [w, h] = size.value.split('x').map(Number);
    frame.src = `screen.html?screen=${screen.value}`;
    frame.width = w; frame.height = h;
    frame.className = w < h ? 'phone' : '';
  }
  screen.addEventListener('change', update); size.addEventListener('change', update); update();
</script>
</body>
</html>
